# Rebuilds the PC Hardware catalog (catalog/*.json) every week so new GPUs,
# CPUs, boards and peripherals show up in the app on their own.
name: Update hardware catalog

on:
  schedule:
    - cron: '17 3 * * 1,4' # Monday and Thursday, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['catalog-extra/**', 'tools/catalog/**']

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade dbgpu
      - run: python tools/catalog/build.py catalog
      - name: Commit catalog if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          if [ -d catalog-cache ]; then git add catalog-cache; fi
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update hardware catalog ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
