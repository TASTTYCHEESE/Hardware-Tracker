# Builds only the Mac app and adds it to the current version's release
# (for when the Mac part of "Release app" couldn't get a machine).
name: Release Mac app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    # Intel Mac runner: GitHub's Apple Silicon runners are often too busy to start.
    # It builds both the Intel and the Apple Silicon app.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release-notes
      # No paid Apple certificate: the app is ad-hoc signed (identity "-" in package.json).
      - run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
